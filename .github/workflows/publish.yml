# Publishes the Tonight app (the docs/ folder) to GitHub Pages and keeps its
# recommendation data fresh. Runs on every change, once a day, or on demand.
name: Publish Tonight

on:
  push:
    branches: [main]
  schedule:
    - cron: "23 9 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - name: Refresh show data
        if: github.event_name != 'push'
        continue-on-error: true
        run: node scripts/build-data.mjs

      # Keep a weekly snapshot in the repo so there is always recent data to fall back on.
      - name: Save weekly snapshot
        if: github.event_name == 'schedule'
        continue-on-error: true
        run: |
          if [ "$(date -u +%u)" = "1" ] && ! git diff --quiet -- docs/data; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/data
            git commit -m "Refresh show data"
            git push
          fi

      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs

      - id: deploy
        uses: actions/deploy-pages@v4
