<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Tonight</title>
    <meta name="description" content="A calm little tracker for the shows you watch." />
    <meta name="theme-color" content="#F5F6FB" />
    <meta name="color-scheme" content="light" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Tonight" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" type="image/png" href="icons/icon-192.png" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
    <link rel="preload" href="fonts/figtree.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="fonts/bricolage.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main id="view" aria-live="polite"></main>
    <nav id="nav" aria-label="Sections"></nav>
    <div id="sheet-root"></div>
    <div id="toast-root" role="status" aria-live="polite"></div>
    <noscript>Tonight needs JavaScript turned on.</noscript>
    <script type="module" src="app.js"></script>
  </body>
</html>
